<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#121210" />
    <title>Update Kessick Portal</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 32px 24px; background: #121210; color: #f5f2eb; font: 16px/1.6 system-ui, sans-serif; }
      main { width: 100%; max-width: 440px; text-align: center; }
      img { width: 180px; max-width: 70%; height: auto; margin-bottom: 32px; }
      h1 { font-size: 28px; line-height: 1.25; margin: 0 0 16px; }
      p { color: #d3d0c9; margin: 12px 0; }
      button { width: 100%; min-height: 52px; margin-top: 20px; border: 0; border-radius: 6px; background: #b39862; color: #121210; font: inherit; font-weight: 650; cursor: pointer; }
      button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
      button:disabled { cursor: progress; opacity: .75; }
      #update-status { min-height: 26px; font-size: 14px; }
    </style>
    <script src="./app-update.js" defer></script>
  </head>
  <body>
    <main>
      <img src="./kessick-logo-white.svg" alt="Kessick Wine Cellars" />
      <h1>Portal update ready</h1>
      <p>Update your saved app to load the latest portal and published content.</p>
      <p>Your saved work stays in place. You do not need to reinstall the app.</p>
      <button id="update-now" type="button">Update now</button>
      <p id="update-status" role="status" aria-live="polite">Ready to update.</p>
      <noscript><p>Enable JavaScript, then reopen this app to update.</p></noscript>
    </main>
  </body>
</html>
