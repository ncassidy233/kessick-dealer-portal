        "200":
          description: Sent notification
          content: { application/json: { schema: { $ref: "#/components/schemas/PortalV2NotificationResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /portal-v2/admin/notifications/{notificationId}/history:
    get:
      operationId: listPortalV2AdminNotificationHistory
      tags: [portal-v2]
      summary: List Portal v2 notification recipients and delivery attempts
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Notification recipient history
          content: { application/json: { schema: { $ref: "#/components/schemas/PortalV2NotificationHistoryResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /portal-v2/notifications:
    get:
      operationId: listPortalV2Notifications
      tags: [portal-v2]
      summary: List sent, unexpired notifications addressed to the dealer
      responses:
        "200":
          description: Dealer notifications and recipient state
          content: { application/json: { schema: { $ref: "#/components/schemas/PortalV2DealerNotificationsResponse" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /portal-v2/notifications/{notificationId}/read:
    post:
      operationId: markPortalV2NotificationRead
      tags: [portal-v2]
      summary: Mark a Portal v2 notification as read
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated recipient state
          content: { application/json: { schema: { $ref: "#/components/schemas/PortalV2NotificationRecipientResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /portal-v2/notifications/{notificationId}/acknowledge:
    post:
      operationId: acknowledgePortalV2Notification
      tags: [portal-v2]
      summary: Acknowledge a Portal v2 notification requiring acknowledgement
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated recipient state
          content: { application/json: { schema: { $ref: "#/components/schemas/PortalV2NotificationRecipientResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /portal-v2/notification-preferences:
    get:
      operationId: getPortalV2NotificationPreferences
      tags: [portal-v2]
      summary: Get the dealer's Portal v2 notification preferences
      responses:
        "200":
          description: Dealer notification preferences
          content: { application/json: { schema: { $ref: "#/components/schemas/PortalV2NotificationPreferencesResponse" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: updatePortalV2NotificationPreferences
      tags: [portal-v2]
      summary: Update the dealer's Portal v2 notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalV2NotificationPreferencesUpdate" }
      responses:
        "200":
          description: Updated dealer notification preferences
          content: { application/json: { schema: { $ref: "#/components/schemas/PortalV2NotificationPreferencesResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    KessickOAuth:
      type: oauth2
      description: Authorization Code with PKCE. Users authenticate and consent in Kessick; access tokens last 15 minutes and refresh tokens are revocable.
      flows:
        authorizationCode:
          authorizationUrl: /api/oauth/authorize
          tokenUrl: /api/oauth/token
          scopes:
            catalog:read: Read approved public catalog facts
            project:read: Read only projects authorized for the user
            concierge:ask: Submit credit-acknowledged grounded requests
            action:confirm: Confirm a reviewed action
            mcp:use: Use the read-first MCP adapter
    ConciergeBearer:
      type: http
      scheme: bearer
      bearerFormat: Kessick connection token
      description: Per-user, scoped, expiring and revocable token issued only after the user authenticates with Clerk in Kessick.
  responses:
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Unauthorized:
      description: Authentication required
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Forbidden:
      description: Forbidden
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: Version or state conflict
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  schemas:
    KnowledgeDocument:
      type: object
      required: [id, title, category, fileName, contentType, byteSize, extractedText, audience, status, errorMessage, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        category: { type: string }
        fileName: { type: string }
        contentType: { type: string, enum: [application/pdf, text/plain] }
        byteSize: { type: integer }
        extractedText: { type: string }
        audience: { type: string, enum: [staff, approved_dealers] }
        status: { type: string, enum: [review, active, archived, error] }
        errorMessage: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    KnowledgeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeDocument" }
    KnowledgeUploadTicket:
      type: object
      required: [uploadId, uploadUrl, expiresAt]
      properties:
        uploadId: { type: string, format: uuid }
        uploadUrl: { type: string }
        expiresAt: { type: string, format: date-time }
    KnowledgeInsights:
      type: object
      required: [from, to, totals, sourceUsage, knowledgeGaps]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals:
          type: object
          required: [conversations, answered, unanswered, failed]
          properties:
            conversations: { type: integer }
            answered: { type: integer }
            unanswered: { type: integer }
            failed: { type: integer }
        sourceUsage:
          type: array
          items:
            type: object
            required: [sourceType, count]
            properties:
              sourceType: { type: string, enum: [knowledge, catalog, project, other] }
              count: { type: integer }
        knowledgeGaps:
          type: array
          items:
            type: object
            required: [reason, count]
            properties:
              reason: { type: string }
              count: { type: integer }
    KnowledgeBytes:
      type: string
      format: binary
    KnowledgeUploadInput:
      type: object
      required: [fileName, contentType, byteSize]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, enum: [application/pdf, text/plain] }
        byteSize: { type: integer, minimum: 1, maximum: 10485760 }
    KnowledgeCompletionInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, minLength: 1, maxLength: 80 }
    KnowledgeEditInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, minLength: 1, maxLength: 80 }
        extractedText: { type: string, minLength: 1, maxLength: 200000 }
        audience: { type: string, enum: [staff, approved_dealers] }
        confirmDealerVisibility: { type: boolean }
    KnowledgeStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, review, archived] }
    PortalV2AccountStatus:
      type: string
      enum: [pending, approved, suspended]
    PortalV2Role:
      type: string
      enum: [super_admin, staff_admin, sales_rep, content_manager, dealer, customer]
    PortalV2Capability:
      type: string
      enum: [admin:overview, users:read, users:write, groups:read, groups:write, reps:write, content:read, content:write, notifications:read, notifications:write, notifications:history, pricebooks:read]
    PortalV2ContentKind:
      type: string
      enum: [project, price_book, resource_category, product_series, finish, training, launch_kit, resource, form, announcement]
    PortalV2Visibility:
      type: string
      enum: [everyone, groups, individuals]
    PortalV2NotificationPriority:
      type: string
      enum: [low, normal, high]
    PortalV2NotificationStatus:
      type: string
      enum: [draft, scheduled, sent, cancelled]
    PortalV2NotificationDraftStatus:
      type: string
      enum: [draft, scheduled]
    PortalV2PushStatus:
      type: string
      enum: [not_attempted, skipped_vapid, skipped_preference, sent, failed]
    PortalV2Organization:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { $ref: "#/components/schemas/PortalV2AccountStatus" }
        createdAt: { type: string, format: date-time }
      required: [id, name, slug, status, createdAt]
    PortalV2AssignedRep:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: ["string", "null"] }
      required: [id, email, displayName]
    PortalV2Group:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: ["string", "null"], maxLength: 500 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        memberCount: { type: integer, minimum: 0 }
      required: [id, name, description, createdAt, updatedAt, memberCount]
    PortalV2User:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: ["string", "null"] }
        role: { $ref: "#/components/schemas/PortalV2Role" }
        status: { $ref: "#/components/schemas/PortalV2AccountStatus" }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
        groups:
          type: array
          items: { $ref: "#/components/schemas/PortalV2Group" }
        assignedRepId: { type: ["string", "null"], format: uuid }
        assignedRep:
          anyOf:
            - { $ref: "#/components/schemas/PortalV2AssignedRep" }
            - { type: "null" }
      required: [id, email, displayName, role, status, emailVerified, createdAt, groups, assignedRepId]
    PortalV2BootstrapInput:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
    PortalV2BootstrapResponse:
      type: object
      additionalProperties: false
      properties:
        account: { $ref: "#/components/schemas/PortalV2User" }
        role: { $ref: "#/components/schemas/PortalV2Role" }
        authorized: { type: boolean }
        organization:
          anyOf:
            - { $ref: "#/components/schemas/PortalV2Organization" }
            - { type: "null" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/PortalV2Group" }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/PortalV2Capability" }
      required: [account, role, authorized, groups, capabilities]
    PortalV2AdminOverviewCounts:
      type: object
      additionalProperties: false
      properties:
        dealers: { type: integer, minimum: 0 }
        approvedDealers: { type: integer, minimum: 0 }
        staff: { type: integer, minimum: 0 }
        groups: { type: integer, minimum: 0 }
        content: { type: integer, minimum: 0 }
        notifications: { type: integer, minimum: 0 }
        unreadAcknowledgements: { type: integer, minimum: 0 }
      required: [dealers, approvedDealers, staff, groups, content, notifications, unreadAcknowledgements]
    PortalV2AuditMetadata:
      type: object
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/PortalV2Role" }
        changed:
          type: array
          items: { type: string }
        reassignToGroupId: { type: ["string", "null"], format: uuid }
        count: { type: integer, minimum: 0 }
        accountId: { type: string, format: uuid }
        salesRepAccountId: { type: ["string", "null"], format: uuid }
        kind: { $ref: "#/components/schemas/PortalV2ContentKind" }
        recipientCount: { type: integer, minimum: 0 }
        pushConfigured: { type: boolean }
        status: { $ref: "#/components/schemas/PortalV2NotificationStatus" }
    PortalV2AuditEvent:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        actorAccountId: { type: ["string", "null"], format: uuid }
        organizationId: { type: ["string", "null"], format: uuid }
        projectId: { type: ["string", "null"], format: uuid }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: ["string", "null"] }
        metadata: { $ref: "#/components/schemas/PortalV2AuditMetadata" }
        createdAt: { type: string, format: date-time }
      required: [id, actorAccountId, organizationId, projectId, action, targetType, targetId, metadata, createdAt]
    PortalV2AdminOverviewResponse:
      type: object
      additionalProperties: false
      properties:
        counts: { $ref: "#/components/schemas/PortalV2AdminOverviewCounts" }
        recentAudit:
          type: array
          items: { $ref: "#/components/schemas/PortalV2AuditEvent" }
      required: [counts, recentAudit]
    PortalV2UsersResponse:
      type: object
      additionalProperties: false
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/PortalV2User" }
      required: [users]
    PortalV2UserCreate:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 320 }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: "#/components/schemas/PortalV2Role" }
        status: { $ref: "#/components/schemas/PortalV2AccountStatus" }
        organizationId: { type: string, format: uuid }
      required: [email, role]
    PortalV2UserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: ["string", "null"], minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/PortalV2AccountStatus" }
        role:
          type: string
          enum: [super_admin, staff_admin, sales_rep, content_manager]
    PortalV2UserResponse:
      type: object
      additionalProperties: false
      properties:
        user: { $ref: "#/components/schemas/PortalV2User" }
      required: [user]
    PortalV2RepAssignmentInput:
      type: object
      additionalProperties: false
      properties:
        salesRepAccountId: { type: ["string", "null"], format: uuid }
      required: [salesRepAccountId]
    PortalV2RepAssignmentResponse:
      type: object
      additionalProperties: false
      properties:
