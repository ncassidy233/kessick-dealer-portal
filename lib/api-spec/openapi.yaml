  /staff/portal/resources/{id}:
    get:
      operationId: downloadPortalResourceForStaff
      tags: [dealer-portal]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Protected resource file, content: { application/octet-stream: { schema: { type: string, format: binary } } } } }
    patch: { operationId: updatePortalResource, tags: [dealer-portal], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, responses: { "200": { description: Updated resource, content: { application/json: { schema: { type: object, additionalProperties: true } } } } } }
    delete: { operationId: deletePortalResource, tags: [dealer-portal], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { "204": { description: Deleted } } }
  /staff/portal/notifications:
    get: { operationId: listPortalNotifications, tags: [dealer-portal], responses: { "200": { description: Notifications, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } } } }
    post: { operationId: sendPortalNotification, tags: [dealer-portal], requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, responses: { "201": { description: Sent notification, content: { application/json: { schema: { type: object, additionalProperties: true } } } } } }
  /staff/portal/audit:
    get: { operationId: listPortalAudit, tags: [dealer-portal], responses: { "200": { description: Portal audit events, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } } } } } } }
  /staff/portal/seed:
    post: { operationId: seedPortalDemo, tags: [dealer-portal], responses: { "200": { description: Seed result, content: { application/json: { schema: { type: object, additionalProperties: true } } } } } }
  /v1/concierge/usage:
    get:
      operationId: getConciergeUsagePolicy
      tags: [concierge]
      summary: Review AI credit usage and request limits
      security: [{ KessickOAuth: [concierge:ask] }, { ConciergeBearer: [] }]
      responses:
        "200":
          description: Current limits and billing notice
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/concierge/catalog/search:
    get:
      operationId: searchConciergeCatalog
      tags: [concierge]
      summary: Search only the approved public Kessick catalog
      security: [{ KessickOAuth: [catalog:read] }, { ConciergeBearer: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        "200":
          description: Approved catalog grounding records with release provenance
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/concierge/projects:
    get:
      operationId: listConciergeProjects
      tags: [concierge]
      summary: List projects authorized for the connected user
      security: [{ KessickOAuth: [project:read] }, { ConciergeBearer: [] }]
      responses:
        "200": { description: Authorized projects, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Project" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/concierge/projects/{projectId}:
    get:
      operationId: getConciergeProject
      tags: [concierge]
      summary: Get one authorized project with role-based redaction
      security: [{ KessickOAuth: [project:read] }, { ConciergeBearer: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Authorized project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/concierge/ask:
    post:
      operationId: askKessickConcierge
      tags: [concierge]
      summary: Ask Kessick AI using only authorized catalog and project facts
      description: Consumes the workspace owner's Replit AI credits. Answers identify unknowns, include citations, and never execute a suggested action.
      security: [{ KessickOAuth: [concierge:ask] }, { ConciergeBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                message: { type: string, minLength: 1, maxLength: 4000 }
                projectId: { type: string, format: uuid }
                conversationId: { type: string, format: uuid }
                acknowledgeCreditUsage: { type: boolean, const: true }
              required: [message, acknowledgeCreditUsage]
      responses:
        "200":
          description: Grounded answer, citations, and optional unexecuted reviewable action
          content: { application/json: { schema: { $ref: "#/components/schemas/ConciergeAnswer" } } }
        "400": { description: Invalid request or missing credit acknowledgement, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "429": { description: Request limit reached, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "503": { description: AI provider unavailable or timed out; no action was taken, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /v1/concierge/conversations:
    get:
      operationId: listConciergeConversations
      tags: [concierge]
      summary: List the connected user's persisted conversations in one project context
      security: [{ KessickOAuth: [concierge:ask] }, { ConciergeBearer: [] }]
      parameters:
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 25 } }
        - { name: before, in: query, description: Opaque exclusive cursor returned in nextCursor, schema: { type: string } }
      responses:
        "200":
          description: Authorized conversations
          content: { application/json: { schema: { $ref: "#/components/schemas/ConciergeConversationPage" } } }
    post:
      operationId: createConciergeConversation
      tags: [concierge]
      summary: Create a persisted conversation in an authorized project context
      security: [{ KessickOAuth: [concierge:ask] }, { ConciergeBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: { projectId: { type: string, format: uuid } }
      responses:
        "201":
          description: Created conversation
          content: { application/json: { schema: { $ref: "#/components/schemas/ConciergeConversation" } } }
  /v1/concierge/conversations/{conversationId}/messages:
    parameters:
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listConciergeMessages
      tags: [concierge]
      summary: List persisted messages, grounded citations, and reviewable actions
      security: [{ KessickOAuth: [concierge:ask] }, { ConciergeBearer: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: before, in: query, description: Opaque exclusive cursor returned in nextCursor, schema: { type: string } }
      responses:
        "200":
          description: Authorized conversation messages
          content: { application/json: { schema: { $ref: "#/components/schemas/ConciergeMessagePage" } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: sendConciergeMessage
      tags: [concierge]
      summary: Send a credit-acknowledged message in a persisted conversation
      security: [{ KessickOAuth: [concierge:ask] }, { ConciergeBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                content: { type: string, minLength: 1, maxLength: 4000 }
                acknowledgeCreditUsage: { type: boolean, const: true }
              required: [content, acknowledgeCreditUsage]
      responses:
        "200":
          description: Persisted assistant response
          content: { application/json: { schema: { $ref: "#/components/schemas/ConciergeUiMessage" } } }
        "429": { description: Request limit reached, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "503": { description: AI unavailable; no action was taken, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /v1/concierge/actions/{actionId}/confirm:
    post:
      operationId: confirmConciergeAction
      x-openai-isConsequential: true
      tags: [concierge]
      summary: Explicitly confirm a still-current authorized project action
      description: Currently permits only a reviewed project rename. It fails if authorization or project version changed.
      security: [{ KessickOAuth: [action:confirm] }, { ConciergeBearer: [] }]
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                confirm: { type: boolean, const: true }
                conversationId: { type: string, format: uuid }
              required: [confirm]
      responses:
        "200":
          description: Confirmed action and updated project after explicit confirmation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  action: { $ref: "#/components/schemas/ConciergeUiAction" }
                  project: { $ref: "#/components/schemas/Project" }
                required: [action, project]
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/mcp:
    post:
      operationId: callKessickMcp
      tags: [mcp]
      summary: Call the Kessick read-first MCP JSON-RPC adapter
      security: [{ KessickOAuth: [mcp:use] }, { ConciergeBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                jsonrpc: { type: string, const: "2.0" }
                id: { oneOf: [{ type: string }, { type: number }, { type: "null" }] }
                method: { type: string }
                params: { type: object, additionalProperties: true }
              required: [jsonrpc, method]
      responses:
        "200": { description: JSON-RPC response, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /oauth/authorize:
    get:
      operationId: authorizeKessickOAuth
      tags: [concierge]
      summary: Show authenticated user OAuth consent for Custom GPT
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: response_type, in: query, required: true, schema: { type: string, const: code } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, const: S256 } }
      responses:
        "200": { description: Browser consent page, content: { text/html: { schema: { type: string } } } }
        "302": { description: Redirect with authorization code after consent }
  /oauth/token:
    post:
      operationId: exchangeKessickOAuthToken
      tags: [concierge]
      summary: Exchange a one-time PKCE code or rotate a refresh token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token] }
                client_id: { type: string }
                client_secret: { type: string }
                code: { type: string }
                code_verifier: { type: string }
                redirect_uri: { type: string, format: uri }
                refresh_token: { type: string }
              required: [grant_type]
      responses:
        "200": { description: OAuth access and refresh tokens, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { description: Invalid or expired grant, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /oauth/revoke:
    post:
      operationId: revokeKessickOAuthToken
      tags: [concierge]
      summary: Revoke an OAuth access token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
              required: [token]
      responses:
        "200": { description: Revocation is intentionally idempotent }
  /oauth/clients:
    get:
      operationId: listKessickOAuthClients
      tags: [concierge]
      summary: List OAuth clients owned by the signed-in account
      security: [{ ConciergeBearer: [] }]
      responses:
        "200": { description: OAuth clients, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
    post:
      operationId: registerKessickOAuthClient
      tags: [concierge]
      summary: Register a scoped OAuth client as a signed-in account owner
      security: [{ ConciergeBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientName: { type: string, minLength: 1, maxLength: 120 }
                redirectUris: { type: array, items: { type: string, format: uri }, minItems: 1, maxItems: 5 }
                scopes: { type: array, items: { type: string }, minItems: 1, maxItems: 5 }
              required: [clientName, redirectUris, scopes]
      responses:
        "201": { description: Registered client, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /oauth/clients/{clientId}:
    delete:
      operationId: revokeKessickOAuthClient
      tags: [concierge]
      summary: Revoke an owned OAuth client and its future authorizations
      security: [{ ConciergeBearer: [] }]
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
  /portal-v2/bootstrap:
    get:
