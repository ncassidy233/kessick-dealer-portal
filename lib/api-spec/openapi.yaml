          schema: { $ref: "#/components/schemas/PortalV2NotificationStatus" }
      responses:
        "200":
          description: Portal v2 notifications
          content: { application/json: { schema: { $ref: "#/components/schemas/PortalV2NotificationsResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createPortalV2AdminNotification
      tags: [portal-v2]
      summary: Create and optionally deliver a Portal v2 notification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalV2NotificationCreate" }
      responses:
        "201":
          description: Created notification
          content: { application/json: { schema: { $ref: "#/components/schemas/PortalV2NotificationResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /portal-v2/admin/notifications/{notificationId}:
    parameters:
      - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updatePortalV2AdminNotification
      tags: [portal-v2]
