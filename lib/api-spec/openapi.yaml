      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalV2UserUpdate" }
      responses:
        "200":
          description: Updated account
          content: { application/json: { schema: { $ref: "#/components/schemas/PortalV2UserResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
