openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Approved public catalog releases
  - name: pricebook
    description: Protected wholesale pricebooks
  - name: accounts
  - name: organizations
  - name: projects
  - name: invitations
  - name: audit
  - name: concierge
    description: Authenticated, grounded Kessick AI and external connection operations
  - name: mcp
    description: Minimal read-first MCP JSON-RPC adapter
  - name: dealer-portal
    description: Secure dealer portal and staff administration
  - name: portal-v2
    description: Authenticated Portal v2 bootstrap, administration, content, and notifications
paths:
  /staff/concierge/knowledge:
    get:
      operationId: listConciergeKnowledge
      responses:
        "200":
          description: Staff-only documents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeList" }
  /staff/concierge/knowledge/export:
    get:
      operationId: exportConciergeKnowledge
      parameters:
        - { in: query, name: format, schema: { type: string, enum: [json, txt] } }
      responses:
        "200": { description: Metadata and text download }
  /staff/concierge/knowledge/uploads/request:
    post:
      operationId: requestKnowledgeUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeUploadInput" }
      responses:
        "200":
          description: Actor-bound upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeUploadTicket" }
  /staff/concierge/knowledge/uploads/{uploadId}:
    parameters:
      - { in: path, name: uploadId, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: putKnowledgeUpload
      description: Raw PDF or TXT; X-Kessick-CSRF must equal 1.
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { $ref: "#/components/schemas/KnowledgeBytes" }
          text/plain:
            schema: { $ref: "#/components/schemas/KnowledgeBytes" }
      responses:
        "200": { description: Bytes stored }
  /staff/concierge/knowledge/uploads/{uploadId}/complete:
    parameters:
      - { in: path, name: uploadId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: completeKnowledgeUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeCompletionInput" }
      responses:
        "201":
          description: Review or error document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeDocument" }
  /staff/concierge/knowledge/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getConciergeKnowledge
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeDocument" }
    patch:
      operationId: updateConciergeKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeEditInput" }
      responses:
        "200":
          description: Returned to review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeDocument" }
    delete:
      operationId: deleteConciergeKnowledge
      responses:
        "200": { description: Logically deleted }
  /staff/concierge/knowledge/{id}/status:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: setConciergeKnowledgeStatus
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeStatusInput" }
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeDocument" }
  /staff/concierge/insights:
    get:
      operationId: getConciergeInsights
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        "200":
          description: Admin-only aggregate counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeInsights" }
  /staff/concierge/insights/export:
    get:
      operationId: exportConciergeInsights
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        "200": { description: Formula-safe CSV }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog/releases/current:
    get:
      operationId: getCurrentCatalogRelease
      tags: [catalog]
      summary: Get the current approved public catalog release
      description: Returns approved public product metadata and local asset references. Pricing is never included.
      responses:
        "200":
          description: Current catalog release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCatalogRelease"
        "503":
          description: No valid approved catalog release is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pricebooks/current:
    get:
      operationId: getCurrentPricebook
      tags: [pricebook]
      summary: Get the current protected wholesale pricebook
      description: Requires established server-side dealer or Kessick authorization. This endpoint fails closed when no authorization integration exists.
      responses:
        "200":
          description: Authorized pricebook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedPricebook"
        "403":
          description: Wholesale pricebook access is unavailable or forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No approved pricebook is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /account:
    get:
      operationId: getAccount
      tags: [accounts]
      responses:
        "200": { description: Current account context, content: { application/json: { schema: { $ref: "#/components/schemas/AccountContext" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      operationId: updateAccount
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: { displayName: { type: ["string", "null"], maxLength: 120 } }
              required: [displayName]
      responses:
        "200": { description: Updated account, content: { application/json: { schema: { $ref: "#/components/schemas/AccountContext" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /dealer-applications:
    post:
      operationId: createDealerApplication
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                organizationName: { type: string, minLength: 2, maxLength: 160 }
              required: [organizationName]
      responses:
        "201": { description: Pending dealer organization, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /organizations/current:
    get:
      operationId: getCurrentOrganization
      tags: [organizations]
      responses:
        "200": { description: Dealer organization, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /organizations/current/members:
    get:
      operationId: listOrganizationMembers
      tags: [organizations]
      responses:
        "200": { description: Organization members, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OrganizationMember" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createOrganizationMember
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email: { type: string, pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$", maxLength: 320 }
                membershipRole: { type: string, enum: [owner, member] }
              required: [email, membershipRole]
      responses:
        "201": { description: Added organization member, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationMember" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /organizations/current/members/{membershipId}:
    patch:
      operationId: updateOrganizationMember
      tags: [organizations]
      parameters:
        - { name: membershipId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f-]{36}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { type: string, enum: [approved, suspended] }
                membershipRole: { type: string, enum: [owner, member] }
      responses:
        "200": { description: Updated membership, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationMember" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /organizations/current/membership/accept:
    post:
      operationId: acceptCurrentOrganizationMembership
      tags: [organizations]
      summary: Accept a pending dealer team invitation
      responses:
        "200": { description: Accepted dealer membership and updated account context, content: { application/json: { schema: { $ref: "#/components/schemas/AccountContext" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /organizations/current/membership:
    delete:
      operationId: declineCurrentOrganizationMembership
      tags: [organizations]
      summary: Decline a pending dealer team invitation
      responses:
        "204": { description: Dealer membership invitation declined }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      responses:
        "200": { description: Authorized projects, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Project" } } } } }
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectWrite" }
      responses:
        "201": { description: Created project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /projects/import:
    post:
      operationId: importLocalProject
      tags: [projects]
      summary: Deliberately claim a reviewed local project without overwriting cloud work
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/ProjectWrite" }
                - type: object
                  properties:
                    localProjectId: { type: string, minLength: 1, maxLength: 160 }
                  required: [localProjectId]
      responses:
        "200": { description: Existing claimed project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "201": { description: Imported project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f-]{36}$" } }
    get:
      operationId: getProject
      tags: [projects]
      responses:
        "200": { description: Project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/ProjectWrite" }
                - type: object
                  properties: { version: { type: integer, minimum: 1 } }
                  required: [version]
      responses:
        "200": { description: Updated project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: archiveProject
      tags: [projects]
      responses:
        "204": { description: Archived }
  /projects/{projectId}/invitations:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f-]{36}$" } }
    get:
      operationId: listProjectInvitations
      tags: [invitations]
      responses:
        "200": { description: Invitations, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Invitation" } } } } }
    post:
      operationId: createProjectInvitation
      tags: [invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: { email: { type: string, pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$", maxLength: 320 } }
              required: [email]
      responses:
        "201": { description: Invitation and one-time claim token, content: { application/json: { schema: { $ref: "#/components/schemas/InvitationCreated" } } } }
  /invitations/accept:
    post:
      operationId: acceptProjectInvitation
      tags: [invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: { token: { type: string, minLength: 32, maxLength: 256 } }
              required: [token]
      responses:
        "200": { description: Accepted invitation, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /invitations/{invitationId}:
    delete:
      operationId: revokeProjectInvitation
      tags: [invitations]
      parameters:
        - { name: invitationId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f-]{36}$" } }
      responses:
        "204": { description: Revoked }
  /projects/{projectId}/images:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f-]{36}$" } }
    get:
      operationId: listProjectImages
      tags: [projects]
      responses:
        "200": { description: Images, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectImage" } } } } }
    post:
      operationId: requestProjectImageUpload
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                fileName: { type: string, minLength: 1, maxLength: 255 }
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
                byteSize: { type: integer, minimum: 1, maximum: 15728640 }
              required: [fileName, contentType, byteSize]
      responses:
        "200": { description: Direct private upload target, content: { application/json: { schema: { $ref: "#/components/schemas/ImageUploadTarget" } } } }
  /projects/{projectId}/images/complete:
    post:
      operationId: completeProjectImageUpload
      tags: [projects]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f-]{36}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                uploadId: { type: string, pattern: "^[0-9a-f-]{36}$" }
              required: [uploadId]
      responses:
        "201": { description: Registered image, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectImage" } } } }
  /project-images/{imageId}/content:
    get:
      operationId: getProjectImageContent
      tags: [projects]
      parameters:
        - { name: imageId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f-]{36}$" } }
      responses:
        "200": { description: Authorized private image bytes, content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /project-images/{imageId}:
    delete:
      operationId: deleteProjectImage
      tags: [projects]
      parameters:
        - { name: imageId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f-]{36}$" } }
      responses:
        "204": { description: Deleted }
  /audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      parameters:
        - { name: projectId, in: query, schema: { type: string, pattern: "^[0-9a-f-]{36}$" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: Authorized audit events, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } } } } }
  /staff/dealer-organizations:
    get:
      operationId: listDealerOrganizationsForStaff
      tags: [organizations]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, suspended] } }
      responses:
        "200": { description: Dealer organizations, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Organization" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /staff/dealer-organizations/{organizationId}/status:
    patch:
      operationId: updateDealerOrganizationStatus
      tags: [organizations]
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f-]{36}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: { status: { type: string, enum: [approved, suspended] } }
              required: [status]
      responses:
        "200": { description: Updated organization, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /dealer-portal/dashboard:
    get:
      operationId: getDealerPortalDashboard
      tags: [dealer-portal]
      responses:
        "200": { description: Dashboard summary, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /dealer-portal/pricing:
    get:
      operationId: getDealerPortalPricing
      tags: [dealer-portal]
      responses:
        "200": { description: Resolved pricing, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
  /dealer-portal/forms:
    get:
      operationId: listDealerPortalForms
      tags: [dealer-portal]
      responses:
        "200": { description: Visible forms, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
  /dealer-portal/forms/{formId}/submissions:
    post:
      operationId: submitDealerPortalForm
      tags: [dealer-portal]
      parameters: [{ name: formId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PortalFormSubmissionInput" } } } }
      responses: { "201": { description: Submitted, content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
  /dealer-portal/resources:
    get:
      operationId: listDealerPortalResources
      tags: [dealer-portal]
      responses:
        "200": { description: Visible resources, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
  /dealer-portal/resources/{resourceId}/file:
    get:
      operationId: downloadDealerPortalResource
      tags: [dealer-portal]
      parameters: [{ name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Protected resource file, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /dealer-portal/notifications:
    get:
      operationId: listDealerPortalNotifications
      tags: [dealer-portal]
      responses:
        "200": { description: Notifications, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
  /dealer-portal/notifications/{notificationId}/read:
    post:
      operationId: markDealerPortalNotificationRead
      tags: [dealer-portal]
      parameters: [{ name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Read notification, content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
  /dealer-portal/notifications/read-all:
    post:
      operationId: markAllDealerPortalNotificationsRead
      tags: [dealer-portal]
      responses: { "204": { description: Notifications marked read } }
  /dealer-portal/access:
    get:
      operationId: getDealerPortalAccess
      tags: [dealer-portal]
      responses: { "200": { description: Resolved access, content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
  /dealer-portal/push-subscriptions:
    post:
      operationId: registerDealerPortalPushSubscription
      tags: [dealer-portal]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PushSubscriptionInput" } } } }
      responses: { "201": { description: Registered, content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
    delete:
      operationId: deleteDealerPortalPushSubscription
      tags: [dealer-portal]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PushSubscriptionDeleteInput" } } } }
      responses: { "204": { description: Deleted } }
  /dealer-portal/push-config:
    get:
      operationId: getDealerPortalPushConfiguration
      tags: [dealer-portal]
      responses: { "200": { description: Push configuration status, content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
  /staff/portal/users:
    get:
      operationId: listPortalUsers
      tags: [dealer-portal]
      responses: { "200": { description: Users, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } } }
  /staff/portal/users/invite:
    post:
      operationId: invitePortalUser
      tags: [dealer-portal]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PortalUserInviteInput" } } } }
      responses: { "201": { description: Pending account, content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
  /staff/portal/users/{id}/status:
    patch:
      operationId: updatePortalUserStatus
      tags: [dealer-portal]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PortalUserStatusInput" } } } }
      responses: { "200": { description: Updated user, content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
  /staff/portal/groups:
    get:
      operationId: listPortalGroups
      tags: [dealer-portal]
      responses: { "200": { description: Groups, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } } }
    post:
      operationId: createPortalGroup
      tags: [dealer-portal]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PortalGroupInput" } } } }
      responses: { "201": { description: Created group, content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
  /staff/portal/groups/{id}:
    patch:
      operationId: updatePortalGroup
      tags: [dealer-portal]
