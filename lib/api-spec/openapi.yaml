        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /portal-v2/admin/groups/{groupId}:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updatePortalV2AdminGroup
      tags: [portal-v2]
      summary: Update a Portal v2 group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalV2GroupUpdate" }
      responses:
        "200":
          description: Updated group
          content: { application/json: { schema: { $ref: "#/components/schemas/PortalV2GroupResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
