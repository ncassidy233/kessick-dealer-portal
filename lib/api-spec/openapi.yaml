  /staff/portal/forms:
    get: { operationId: listPortalForms, tags: [dealer-portal], responses: { "200": { description: Forms, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } } } }
    post: { operationId: createPortalForm, tags: [dealer-portal], requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, responses: { "201": { description: Form, content: { application/json: { schema: { type: object, additionalProperties: true } } } } } }
  /staff/portal/form-submissions:
    get:
      operationId: listPortalFormSubmissions
      tags: [dealer-portal]
      responses: { "200": { description: Dealer form responses, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } } }
  /staff/portal/forms/{id}:
    patch: { operationId: updatePortalForm, tags: [dealer-portal], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, responses: { "200": { description: Updated form, content: { application/json: { schema: { type: object, additionalProperties: true } } } } } }
    delete: { operationId: deletePortalForm, tags: [dealer-portal], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { "204": { description: Deleted } } }
  /staff/portal/resources:
    get: { operationId: listPortalResources, tags: [dealer-portal], responses: { "200": { description: Resources, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } } } }
    post: { operationId: createPortalResource, tags: [dealer-portal], requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, responses: { "201": { description: Resource, content: { application/json: { schema: { type: object, additionalProperties: true } } } } } }
  /staff/portal/resource-uploads/request:
    post:
      operationId: requestPortalResourceUpload
      tags: [dealer-portal]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PortalResourceUploadRequest" } } } }
