  /staff/portal/resource-uploads/complete:
    post:
      operationId: completePortalResourceUpload
      tags: [dealer-portal]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PortalResourceUploadCompletion" } } } }
